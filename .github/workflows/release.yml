name: release

# Triggered by pushing a `vX.Y.Z` tag to `main`. The tag IS the
# release signal — there is no Actions-tab dispatch, no version
# input, and no CI-side `cargo set-version`. The human-side bump
# happens in a normal PR before the tag is pushed; the workflow
# only builds, publishes, and verifies.
#
# See docs/RELEASE.md for the human-facing release procedure.
#
# Job sequence:
#
#   guard ┬→ build (matrix) → publish-github → publish-crates
#         └→ publish-gate ───────────────────┘
#
# 1. guard:          asserts that `Cargo.toml` at the tagged
#                    commit reads `version = "${tag#v}"`. Catches
#                    a tag pushed against the wrong commit before
#                    any expensive job runs.
# 2. build:          cross-builds release binaries on three OS
#                    runners.
# 3. publish-github: assembles checksums and creates the GitHub
#                    Release with auto-generated notes.
# 4. publish-gate:   parses the head commit's message line by
#                    line and outputs `publish=true|false`. Only
#                    a STANDALONE `[skip publish]` line counts
#                    as a skip; mentions of the token inside a
#                    sentence do not. Runs in parallel with
#                    build so it does not lengthen the critical
#                    path.
# 5. publish-crates: exchanges an OIDC token via
#                    rust-lang/crates-io-auth-action and runs
#                    `cargo publish`, but only if
#                    `publish-gate.outputs.publish == 'true'`.
#                    Requires Trusted Publishing to be configured
#                    on crates.io for this repo + workflow
#                    filename (one-time setup).
#
# No long-lived secrets. GITHUB_TOKEN is auto-provided; crates.io
# trust is established via OIDC, not via CARGO_REGISTRY_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: guard (Cargo.toml version matches tag)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Derive version from tag and check Cargo.toml
        id: derive
        # `${GITHUB_REF_NAME}` is the tag (e.g. `v0.0.36`).
        # `${GITHUB_REF_NAME#v}` strips the leading `v`. We then
        # read the version from `Cargo.toml` and fail if they do
        # not match — the most common footgun under the human-tag
        # flow is "tagged the wrong commit". Catching it here
        # avoids burning ~10 min of build matrix on a tag that
        # will never publish.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $tag is not in vX.Y.Z form" >&2
            exit 1
          fi
          version="${tag#v}"
          manifest_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::tag $tag implies version $version, but Cargo.toml reads $manifest_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "guard ok: tag=$tag version=$version Cargo.toml=$manifest_version"

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: pathlint
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: pathlint.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: pathlint
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: pathlint
          # Termux (aarch64-linux-android) builds from source via
          # `pkg install rust && cargo install pathlint`. NDK setup
          # for cross is not worth a prebuilt binary today.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          name="pathlint-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pathlint-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-github:
    name: publish GitHub Release
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -la dist

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Generate JSON Schemas
        # Re-run the generators from the tagged commit so the
        # release assets match the schemars derives at that
        # version. The drift tests in CI guarantee the results
        # match the checked-in schemas/*.schema.json files on
        # main.
        run: |
          cargo run --release --bin gen_schema > dist/pathlint.schema.json
          cargo run --release --bin gen_check_schema > dist/check.schema.json
          cargo run --release --bin gen_doctor_schema > dist/doctor.schema.json
          cargo run --release --bin gen_trace_schema > dist/trace.schema.json
          cargo run --release --bin gen_sort_schema > dist/sort.schema.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.schema.json 2>/dev/null | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/pathlint.schema.json
            dist/check.schema.json
            dist/doctor.schema.json
            dist/trace.schema.json
            dist/sort.schema.json
            dist/SHA256SUMS

  publish-gate:
    name: decide whether to publish to crates.io
    # `contains(..., '[skip publish]')` is substring match — it
    # fires when the release commit's body merely *mentions* the
    # token, even inside an explanatory paragraph. That bit
    # 0.0.36, whose commit body discussed the token spelling and
    # accidentally got its own publish skipped. This job parses
    # the commit message line by line and only flags a skip when
    # the literal string `[skip publish]` is a STANDALONE LINE
    # (whitespace-trimmed). Documentation that merely references
    # the token no longer trips the gate.
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Inspect head commit message
        id: gate
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # `grep -Fxq` matches the whole line literally; the
          # leading awk trim collapses surrounding whitespace so
          # `  [skip publish]  ` still counts. Mentions inside a
          # sentence ("set `[skip publish]` in the bump commit")
          # never appear as their own line, so they do not match.
          if printf '%s' "$COMMIT_MSG" | awk '{$1=$1;print}' | grep -Fxq '[skip publish]'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Found '[skip publish]' as a standalone line — crates.io publish will be skipped."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No standalone '[skip publish]' line — will publish to crates.io."
          fi

  publish-crates:
    name: publish to crates.io (OIDC)
    # Opt-out via `[skip publish]` on its own line in the head
    # commit's message. The default for a tagged release is
    # "publish everywhere" — cutting a release means shipping it;
    # skipping crates.io is the exception that must be spelled
    # out. The standalone-line gate logic lives in `publish-gate`
    # above.
    if: ${{ needs.publish-gate.outputs.publish == 'true' }}
    needs: [guard, publish-github, publish-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Exchange OIDC token for crates.io token
        id: auth
        # Pin to v1.0.4: the first release on Node 24, silences
        # the "Node.js 20 actions are deprecated" warning.
        # Re-evaluate when v1.1 / v2 ships.
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish pathlint
        # Skip when this version is already on crates.io. Reruns
        # of a partially-failed publish-crates job would otherwise
        # abort here with "crate already exists on crates.io
        # index"; same guard pattern as runex.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -fsS -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/pathlint/$version" || echo "000")
          if [ "$status" = "200" ]; then
            echo "pathlint $version already on crates.io — skipping publish"
          else
            cargo publish
          fi
